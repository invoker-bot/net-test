    <text x="105" y="21" text-anchor="middle"
          font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace"
          font-size="15" font-weight="700" fill="#166534">UDP</text>
    <rect x="0" y="42" width="62" height="30" rx="8" fill="#FEF3C7"/>
    <text x="31" y="63" text-anchor="middle"
          font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace"
